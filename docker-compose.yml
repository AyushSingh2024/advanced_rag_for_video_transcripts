services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # One-shot: applies migrations/*.sql, then exits. The app waits on it finishing
  # rather than on Postgres merely accepting connections, so the first request
  # cannot hit a database without tables.
  #
  # Both images build from the repo root rather than ./backend, because the page
  # the server serves lives in ./frontend and a context cannot reach outside
  # itself. See backend/Dockerfile.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["npm", "run", "migrate"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ./backend/.env
    # .env points at localhost, which inside a container means the container
    # itself. These two overrides redirect it at the sibling services; everything
    # else in .env (API keys, model names, limits) passes through untouched.
    environment:
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
      QDRANT_URL: http://qdrant:6333
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Qdrant's image carries no HTTP client, so there is no honest healthcheck
      # to wait on here. The app's own /health reports 503 until Qdrant answers,
      # which is what the container HEALTHCHECK watches.
      qdrant:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
